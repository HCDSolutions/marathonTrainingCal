<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Information - Marathon Training Calendar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <ul>
        <li><a href="index.html" id="nav-calendar">Calendar</a></li>
        <li><a href="profile.html" id="nav-profile" class="active">Profile Information</a></li>
        <li><a href="nutrition.html" id="nav-nutrition">Nutrition</a></li>
      </ul>
    </nav>
    <section id="profile" style="margin: 40px auto; max-width: 600px">
      <h2>Profile Information</h2>
      <form id="profile-form" autocomplete="off">
        <div class="form-group">
          <label for="unit-toggle">Units:</label>
          <select id="unit-toggle">
            <option value="imperial">Imperial (in, lbs)</option>
            <option value="metric">Metric (cm, kg)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="profile-height" id="profile-height-label">Height (in):</label>
          <input type="number" id="profile-height" min="40" max="250" step="0.1" />
        </div>
        <div class="form-group">
          <label for="profile-weight" id="profile-weight-label">Current Weight (lbs):</label>
          <input type="number" id="profile-weight" min="0" max="500" step="0.1" />
        </div>
        <div class="form-group">
          <label for="profile-bmi">BMI:</label>
          <input type="text" id="profile-bmi" readonly style="background: #f8f9fa" />
        </div>
      </form>
      <hr style="margin: 30px 0" />
      <h3>Weekly Weight Tracker</h3>
      <form id="weight-form" style="margin-bottom: 18px">
        <label for="weight-date">Date:</label>
        <input type="date" id="weight-date" required />
        <label for="weight-value" id="weight-value-label">Weight (lbs):</label>
        <input type="number" id="weight-value" min="30" max="500" step="0.1" required />
        <button type="submit" class="btn-primary" style="margin-left: 8px">Add</button>
      </form>
      <table id="weight-history" style="width: 100%; border-collapse: collapse">
        <thead>
          <tr>
            <th>Date</th>
            <th id="weight-history-header">Weight (lbs)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <script src="main.js"></script>
  </body>
</html>
